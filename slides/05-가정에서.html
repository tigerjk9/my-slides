<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>가정에서 해주실 일</title>
<style>* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background:#FAFAFB; color:#55555C; word-break:keep-all; }
.slide { width:100%; height:100%; padding:7% 8%; display:flex; flex-direction:column;
  justify-content:center; position:relative; }
.pill { display:inline-flex; align-self:flex-start; padding:.5em 1.1em; border-radius:2em;
  background:#E75297; color:#fff; font-size:1.4vw; font-weight:700; margin-bottom:2vh; }
h1 { font-size:4.4vw; font-weight:800; color:#231715; line-height:1.25; letter-spacing:-.02em; }
h2 { font-size:2.4vw; font-weight:800; color:#6256A2; margin-bottom:2vh; }
p { font-size:1.9vw; line-height:1.7; margin-top:2vh; max-width:82%; }
ul { margin-top:2.4vh; font-size:1.9vw; line-height:2; padding-left:1.2em; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:1.6vw; margin-top:3vh; }
.card { background:#fff; border-radius:1.2vw; padding:2vw;
  box-shadow:0 .6vw 2vw rgba(35,23,21,.06); }
.card b { display:block; font-size:1.9vw; color:#231715; margin-bottom:.8vh; }
.card span { font-size:1.5vw; color:#55555C; line-height:1.6; }
.big { font-size:9vw; font-weight:800; color:#6256A2; line-height:1; }
footer { position:absolute; bottom:4%; left:8%; right:8%; display:flex;
  justify-content:space-between; font-size:1.2vw; color:#9A97A5; }</style></head>
<body>
  <div class="slide">
    <h2>부탁드립니다</h2>
    <h1>가정에서 해주실 일</h1>
    <ul>
      <li>읽는 시간에 어른도 무언가를 읽어 주십시오</li>
      <li>다 읽었는지 확인하지 말아 주십시오</li>
      <li>도서관에 같이 가는 날을 한 달에 하루 정해 주십시오</li>
    </ul>
    <p style="font-size:1.6vw;color:#9A97A5;">질문은 알림장이나 학교 전화로 언제든 주십시오.</p>
    <footer><span>우리 반 독서 습관 만들기</span><span>05</span></footer>
  </div>
</body></html>
