name: 발표자료 다시 만들기

# 언제 도는가 (강의 6장에서 배우는 세 가지 중 둘)
#  1) 슬라이드를 고쳐 올릴 때 — 이게 이 워크플로우의 본체다.
#     슬라이드를 하나 바꿀 때마다 손으로 build.js 를 돌릴 이유가 없다.
#  2) 버튼을 눌러 직접 — 처음 만들 때 예약을 기다리지 않고 바로 확인하려고 열어 둔다.
on:
  push:
    paths:
      - 'slides/**'
      - 'deck.config.json'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write        # 다시 만든 index.html 을 커밋해야 하므로 쓰기 권한이 필요하다

# 슬라이드를 연달아 올리면 실행이 겹친다. 마지막 것만 남긴다.
concurrency:
  group: build-deck
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 내 컴퓨터에서 돌리던 그 명령을 그대로 돌린다. 다른 것을 하지 않는다.
      - name: 발표자료 다시 만들기
        run: node build.js

      - name: 바뀐 내용이 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "chore: 슬라이드 변경에 따라 발표자료 갱신"
            git push
          fi
